name: Actualizar datos del panel

on:
  schedule:
    - cron: "7,37 * * * *"   # cada 30 minutos, fuera de las horas en punto (en :00 y :30 GitHub demora o descarta corridas)
  workflow_dispatch: {}       # botón "Run workflow" para forzarlo a mano

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar pdftotext
        run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Leer las fuentes
        run: python3 scripts/actualizar.py
      - name: Guardar cambios
        run: |
          git config user.name "panel-bot"
          git config user.email "panel-bot@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet || (git commit -m "Datos $(TZ=America/Argentina/Buenos_Aires date '+%d/%m %H:%M')" && (git push || (git pull --rebase -X theirs origin main && git push)))
