<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="color-scheme" content="dark">
<title>Panel legislativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#0b1220; --panel:#121b2e; --panel2:#18233a; --borde:#24314d;
  --texto:#e8edf6; --suave:#93a1bb; --acento:#a77bff; --lla:#7b3fbf;
  --ok:#3ccf91; --alerta:#ffb547; --rojo:#ff6b6b; --activo:#6a3fd1;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
html,body{height:100%;background:var(--fondo);color:var(--texto);
  font-family:Inter,system-ui,sans-serif;overflow:hidden}
body{display:grid;grid-template-rows:auto auto 1fr auto;font-size:1.1vw}
body.quieto{cursor:none}
header{display:flex;align-items:center;gap:2vw;padding:1.4vw 2.4vw 1vw;border-bottom:1px solid var(--borde)}
header .marca{font-weight:800;font-size:1.1em;letter-spacing:.02em;color:var(--suave)}
header .marca b{color:var(--acento)}
header h1{flex:1;font-size:2.2em;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
header .reloj{text-align:right}
header .hora{font-size:2.4em;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.hora .dp{animation:parpadeo 1s steps(1,end) infinite}
@keyframes parpadeo{50%{opacity:0}}
header .fecha{color:var(--suave);font-size:.95em;margin-top:.3em}
main{position:relative;padding:1.6vw 2.4vw;overflow:hidden}
.pagina{position:absolute;inset:1.6vw 2.4vw;opacity:0;transition:opacity .8s;overflow-y:auto;scrollbar-width:none}
.pagina::-webkit-scrollbar{display:none}
.pagina .grilla+.grilla,.pagina .lista+.lista,.pagina .lista+.sub{margin-top:.75vw}
.pagina.visible{opacity:1}
footer{display:flex;align-items:center;gap:1.6vw;padding:.9vw 2.4vw;background:#080e1a;border-top:1px solid var(--borde)}
.cot{display:flex;gap:1.8vw;flex:1;white-space:nowrap}
.cot div{font-variant-numeric:tabular-nums}
.cot span{color:var(--suave);margin-right:.4em}
.cot b{font-weight:700}
.cot .rp b{color:var(--alerta)}
.tabs{display:flex;gap:.6vw;padding:.8vw 2.4vw;border-bottom:1px solid var(--borde);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:inherit;font-size:.9em;font-weight:600;color:var(--suave);background:var(--panel);border:1px solid var(--borde);
  border-radius:.5vw;padding:.45vw 1vw;cursor:pointer;white-space:nowrap}
.tabs button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background-color .15s,color .15s,border-color .15s}
.tabs button:hover{color:var(--texto);border-color:var(--suave)}
.tabs button:focus-visible{outline:3px solid var(--alerta);outline-offset:2px}
.tabs button.on{background:var(--activo);border-color:var(--acento);color:#fff}
.auto{font:inherit;font-size:.85em;font-weight:600;color:var(--texto);background:var(--panel);border:1px solid var(--borde);
  border-radius:.5vw;padding:.35vw .9vw;cursor:pointer;white-space:nowrap;transition:background-color .15s,color .15s,border-color .15s}
.auto:hover{border-color:var(--suave)}
.auto:focus-visible{outline:3px solid var(--alerta);outline-offset:2px}
.auto.on{background:#123d2c;border-color:var(--ok);color:var(--ok)}
.act{color:var(--suave);font-size:.8em;white-space:nowrap}
.barra{position:fixed;left:0;bottom:0;height:3px;background:var(--acento);width:0}

/* componentes */
.sub{color:var(--suave);font-size:1em;margin-bottom:1.2vw}
.sub a{color:var(--suave)}
.lista{display:flex;flex-direction:column;gap:.75vw}
.item{background:var(--panel);border:1px solid var(--borde);border-radius:.6vw;padding:.9vw 1.2vw;line-height:1.3}
.item .org{color:var(--acento);font-weight:700;font-size:.85em;text-transform:uppercase;letter-spacing:.03em;margin-bottom:.25em}
.item .det{font-size:1.15em}
.item .meta{color:var(--suave);font-size:.85em;margin-top:.3em}
.item.destacado{border-color:var(--acento);background:linear-gradient(90deg,#2a1c4a,var(--panel) 60%)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:2vw;height:100%}
.col h2{font-size:1.3em;margin-bottom:.8vw;color:var(--suave);font-weight:600}
.tabla{width:100%;border-collapse:separate;border-spacing:0 .45vw}
.tabla td{background:var(--panel);padding:.5vw 1vw;vertical-align:top;line-height:1.25}
.tabla td.p{color:var(--suave);text-align:right;white-space:nowrap;font-size:.9em}
.tabla td:first-child{border-radius:.5vw 0 0 .5vw;font-weight:700;white-space:nowrap;width:5.5em}
.tabla td:nth-child(2){width:100%}
.tabla td:last-child{border-radius:0 .5vw .5vw 0}
.chip{display:inline-block;padding:.15em .6em;border-radius:1em;font-size:.8em;font-weight:700;white-space:nowrap}
.chip.apro{background:#123d2c;color:var(--ok)}
.chip.pref{background:#45330f;color:var(--alerta)}
.chip.com{background:#1e2a44;color:#b9c6e0}
.chip.ing{background:#2b2147;color:#c9b2ff}
.chip.cambio{background:var(--alerta);color:#201400}
.grilla{display:grid;grid-template-columns:repeat(2,1fr);gap:.7vw}
.proy{background:var(--panel);border:1px solid var(--borde);border-radius:.6vw;padding:.75vw 1vw;display:grid;grid-template-columns:5.2em 1fr;gap:.2vw 1vw;line-height:1.25}
.proy .n{font-weight:800;font-size:1.05em;color:var(--acento)}
.proy .t{font-weight:600}
.proy .e{grid-column:2;color:var(--suave);font-size:.85em}
.proy.cambio{border-color:var(--alerta)}
.resumen{display:flex;gap:1.2vw;margin-bottom:1.2vw}
.kpi{background:var(--panel);border-radius:.6vw;padding:.7vw 1.2vw;border:1px solid var(--borde)}
.kpi b{font-size:2em;display:block;line-height:1}
.kpi span{color:var(--suave);font-size:.85em}
.vacio{color:var(--suave);font-size:1.3em;padding:2vw 0}
.mapa{display:grid;grid-template-columns:1.35fr 1fr;gap:2vw;height:100%;align-items:center}
.mapa svg{width:100%;height:auto}
.leyenda{display:flex;flex-direction:column;gap:.45vw;font-size:.95em}
.leyenda div{display:flex;gap:.6vw;align-items:baseline}
.leyenda i{width:.9vw;height:.9vw;border-radius:50%;flex:none;transform:translateY(.1vw)}
.leyenda b{white-space:nowrap}
.leyenda span{color:var(--suave)}
.hoy{color:var(--alerta);font-weight:800}

/* estructura: cabecera, panel principal + columna de tarjetas, pie financiero */
body{grid-template-rows:auto 1fr auto}
header{gap:1.6vw;padding:1vw 2.4vw;background:#080e1a}
header .logos{display:flex;align-items:center;gap:1.2vw}
header .logos img{height:3.6vw;width:auto;display:block}
header .logos .lla{height:2.9vw}
header .ident{flex:1;padding-left:1.4vw;border-left:1px solid var(--borde)}
header .marca{font-size:1.35em;color:var(--texto)}
header .camara{color:var(--suave);font-size:.95em;margin-top:.2em}
.cuerpo{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:1.2vw;padding:1.1vw 2.4vw;min-height:0}
.principal{display:flex;flex-direction:column;min-height:0;background:#0e1626;border:1px solid var(--borde);border-radius:.9vw;overflow:hidden}
.principal .tabs{padding:.7vw 1vw;gap:.45vw;background:#0b1322}
.principal .tabs button{font-size:.82em;padding:.4vw .8vw}
#titulo{font-size:1.55em;font-weight:800;letter-spacing:-.01em;padding:.9vw 1.4vw 0;text-wrap:balance}
.principal main{flex:1;min-height:0;padding:0;font-size:.92em}
.principal .pagina{inset:.9vw 1.4vw 1vw}
.lateral{display:flex;flex-direction:column;gap:.8vw;min-height:0}
.widget{flex:1 1 0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:.35vw;background:var(--panel);
  border:1px solid var(--borde);border-radius:.9vw;padding:.8vw 1.1vw;color:inherit;text-decoration:none;
  transition:border-color .15s,background-color .15s}
.widget:hover{border-color:var(--suave)}
.widget:focus-visible{outline:3px solid var(--alerta);outline-offset:2px}
.widget.on{border-color:var(--acento);background:#171f38}
.widget h2{display:flex;justify-content:space-between;align-items:baseline;font-size:.78em;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;color:var(--acento)}
.widget h2 small{font-size:1em;color:var(--suave);font-weight:600;text-transform:none;letter-spacing:0}
.widget .mini{display:grid;grid-template-columns:repeat(4,1fr);gap:.5vw}
.widget .mini b{display:block;font-size:1.7em;line-height:1.05;font-variant-numeric:tabular-nums}
.widget .mini span{color:var(--suave);font-size:.72em;line-height:1.2;display:block}
.renglon{display:flex;gap:.8vw;font-size:.9em;line-height:1.3;min-width:0}
.renglon time,.renglon .h{font-weight:700;flex:none;min-width:3.3em;white-space:nowrap;font-variant-numeric:tabular-nums}
.renglon .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.renglon.lec .t{color:var(--acento);font-weight:700}
.widget .nota{color:var(--suave);font-size:.8em;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.widget .nota.n1{-webkit-line-clamp:1}
.widget>*{flex-shrink:0}
.widget .fuerte{font-size:1em;font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

@media (prefers-reduced-motion: reduce){
  .pagina{transition:none}
  .hora .dp{animation:none}
  .barra{display:none}
}
/* teléfono y pantallas chicas: página con scroll, sin rotación automática */
@media (max-width: 900px){
  html,body{overflow:auto;height:auto}
  body{display:block;font-size:16px}
  html{scroll-padding-top:72px}
  .item,.proy{line-height:1.4}
  header{flex-wrap:wrap;gap:4px 12px;padding:calc(14px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left))}
  header .logos img{height:44px}
  header .logos .lla{height:34px}
  header .ident{order:3;width:100%;border-left:0;padding-left:0}
  header .reloj{margin-left:auto}
  #control{display:none}
  header .marca{font-size:1em}
  header .camara{font-size:.8em}
  .cuerpo{display:flex;flex-direction:column;gap:14px;padding:12px 16px}
  .lateral{display:grid;grid-template-columns:1fr;gap:10px;order:-1}
  .widget{flex:none;border-radius:12px;padding:12px 14px;gap:6px}
  .widget .mini span{font-size:.75em}
  .principal{border-radius:12px;overflow:visible}
  .principal .tabs{border-radius:12px 12px 0 0}
  .principal .tabs button{font-size:.9em;padding:8px 14px}
  #titulo{font-size:1.25em;padding:14px 16px 0}
  .principal main{padding:0}
  .principal .pagina{margin:12px 16px}
  header .hora{font-size:1.5em}
  header .fecha{font-size:.8em}
  .tabs{position:sticky;top:0;z-index:5;background:var(--fondo);gap:8px;padding:10px 16px}
  .tabs button{border-radius:8px;padding:8px 14px;font-size:.9em;min-height:44px}
  main{padding:14px 16px 24px;overflow:visible}
  .pagina{position:static;opacity:1;overflow:visible;margin-bottom:14px}
  .dos,.grilla,.mapa,.resumen{grid-template-columns:1fr;gap:10px}
  .resumen{display:grid;grid-template-columns:1fr 1fr}
  .lista{gap:10px}
  .item,.proy,.kpi{border-radius:10px;padding:10px 12px}
  .proy{grid-template-columns:4.6em minmax(0,1fr);gap:2px 10px}
  .grilla>*,.dos>*,.lista>*{min-width:0}
  .det,.proy .t{overflow-wrap:anywhere}
  .col h2{margin:6px 0 8px}
  .tabla{border-spacing:0 6px}
  .tabla td{padding:8px 10px}
  .tabla td.p{white-space:normal;font-size:.8em}
  .tabla td:first-child{border-radius:8px 0 0 8px}
  .tabla td:last-child{border-radius:0 8px 8px 0}
  .leyenda{gap:6px}
  .leyenda i{width:12px;height:12px}
  .leyenda div{display:block}
  .leyenda i{display:inline-block;margin-right:6px;transform:none}
  .leyenda b{margin-right:6px}
  .sub{margin-bottom:10px}
  footer{position:sticky;bottom:0;flex-wrap:wrap;gap:6px 14px;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .cot{flex-wrap:wrap;gap:4px 14px;white-space:normal;font-size:.9em}
  .act{width:100%}
  .barra{display:none}
}
</style>
</head>
<body>
<header>
  <div class="logos">
    <img src="assets/escudo-corrientes.svg" alt="Escudo de la Provincia de Corrientes" width="283" height="402" class="escudo">
    <img src="assets/lla.svg" alt="La Libertad Avanza" width="2477" height="845" class="lla">
  </div>
  <div class="ident">
    <div class="marca">Despacho del Dip. <b>Ricardo Leconte</b></div>
    <div class="camara">Honorable Cámara de Diputados de la Provincia de Corrientes</div>
  </div>
  <div class="reloj"><div class="hora" id="hora">--:--</div><div class="fecha" id="fecha"></div></div>
</header>
<div class="cuerpo">
  <section class="principal" aria-labelledby="titulo">
    <nav class="tabs" id="tabs" aria-label="Secciones del panel"></nav>
    <h1 id="titulo">Panel legislativo</h1>
    <main id="main" aria-live="polite"></main>
  </section>
  <aside class="lateral" id="lateral" aria-label="Resumen"></aside>
</div>
<footer>
  <div class="cot" id="cot"></div>
  <div class="act" id="act"></div>
  <button type="button" id="control" class="auto">❚❚ Pausar</button>
</footer>
<div class="barra" id="barra"></div>

<script>
// ?t=25 cambia los segundos por pantalla; ?s=mapa deja fija una sección.
const P = new URLSearchParams(location.search);
const SEG = Math.max(5, +(P.get('t') || 20));
const FIJA = P.get('s');
const TZ = 'America/Argentina/Buenos_Aires';
let BASE = {}, LIVE = {};

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtN = n => n == null ? '–' : Number(n).toLocaleString('es-AR', {maximumFractionDigits: 0});
const hoyISO = () => new Date().toLocaleDateString('en-CA', {timeZone: TZ});
const fechaCorta = iso => { const [a,m,d] = iso.split('-'); return `${d}/${m}`; };
const diaNombre = iso => new Date(iso + 'T12:00:00').toLocaleDateString('es-AR', {weekday:'long', day:'numeric', month:'long'});
const haceDias = iso => (new Date(hoyISO()) - new Date(iso)) / 864e5;
const trozos = (arr, n) => { const o = []; for (let i = 0; i < arr.length; i += n) o.push(arr.slice(i, i + n)); return o.length ? o : [[]]; };
const fechaRss = s => { const d = new Date(s); return isNaN(d) ? '' : d.toLocaleString('es-AR', {timeZone: TZ, day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23'}); };

function chipEstado(e) {
  const t = (e || '').toLowerCase();
  const c = t.includes('aprob') ? 'apro' : t.includes('prefer') ? 'pref' : t.includes('ingres') ? 'ing' : 'com';
  return `<span class="chip ${c}">${esc(e)}</span>`;
}

// ---------------------------------------------------------------- secciones
const SECCIONES = [
  {id:'proyectos', corto:'Proyectos', titulo:'Proyectos del Dip. Leconte', paginas() {
    const est = LIVE.expedientes || {};
    const lista = [...BASE.proyectos];
    for (const [n, r] of Object.entries(est)) if (r.nuevo && !lista.find(p => p.expte === n))
      lista.unshift({expte:n, tipo:r.tipo, tema:r.asunto, comision:r.comision, estado:'Ingresado'});
    const recientes = lista.filter(p => est[p.expte]?.cambio && haceDias(est[p.expte].cambio) <= 7);
    const ficha = p => {
      const r = est[p.expte] || {};
      const cambio = r.cambio && haceDias(r.cambio) <= 7;
      return `<div class="proy ${cambio ? 'cambio' : ''}"><div class="n">${p.expte.replace(/(\d{2})(\d{3})/, '$1.$2')}</div>
        <div class="t">${esc(p.tema)}</div>
        <div class="e">${p.tipo} · ${esc(p.comision === 'Sin asignar' && r.comision ? r.comision : p.comision)} · ${chipEstado(p.estado)}
        ${cambio ? ` <span class="chip cambio">Cambió el ${fechaCorta(r.cambio)}</span>` : ''}</div></div>`;
    };
    const orden = [...recientes, ...lista.filter(p => !recientes.includes(p))];
    return trozos(orden, 10).map(g => `<div class="grilla">${g.map(ficha).join('')}</div>`);
  }},

  {id:'od', corto:'Orden del día', titulo:'Orden del día · Diputados de Corrientes', paginas() {
    const od = LIVE.hcd_od; if (!od) return [`<div class="vacio">Sin datos del orden del día.</div>`];
    const sub = `<div class="sub">${esc(od.titulo)} · ${od.asuntos.length} asuntos${od.asuntos.some(a=>a.leconte) ? ' · en violeta, los del Dip. Leconte' : ''}</div>`;
    const orden = [...od.asuntos.filter(a => a.leconte), ...od.asuntos.filter(a => !a.leconte)];
    return trozos(orden, 5).map(g => sub + `<div class="lista">${g.map(a => `
      <div class="item ${a.leconte ? 'destacado' : ''}"><div class="org">${esc(a.item)} · ${esc(a.seccion)}${a.expte ? ' · Expte. ' + a.expte.replace(/(\d{2})(\d{3})/, '$1.$2') : ''}</div>
      <div class="det">${esc(a.texto.length > 230 ? a.texto.slice(0, 225).replace(/\s\S*$/, '') + '…' : a.texto)}</div>${a.autores ? `<div class="meta">${esc(a.autores)}</div>` : ''}</div>`).join('')}</div>`);
  }},

  {id:'comisiones', corto:'Comisiones', titulo:'Comisiones y sesiones en Corrientes', paginas() {
    const dias = ['lunes','martes','miércoles','jueves','viernes'];
    const hoy = new Date().toLocaleDateString('es-AR', {weekday:'long', timeZone: TZ});
    const filas = BASE.comisiones.slice().sort((a,b) => dias.indexOf(a.dia) - dias.indexOf(b.dia) || a.hora.localeCompare(b.hora));
    const tabla = d => filas.filter(c => c.dia === d).map(c => `<tr><td>${c.hora}</td><td>${c.leconte ? '<b style="color:var(--acento)">' : ''}${esc(c.nombre)}${c.leconte ? ' · Leconte</b>' : ''}</td><td class="p">${c.preside ? 'Preside ' + esc(c.preside) : ''}</td></tr>`).join('');
    const sen = (LIVE.senado_corrientes || []).map(o => `<tr><td>${fechaCorta(o.fecha)}</td><td>Senado · Orden del día N.º ${o.numero}</td></tr>`).join('');
    const hcd = LIVE.hcd_od ? `<tr><td>${esc(LIVE.hcd_od.rotulo.split(' ')[0].slice(0,5))}</td><td>Diputados · ${esc(LIVE.hcd_od.rotulo.replace(/^\S+\s*-?\s*/, ''))}</td></tr>` : '';
    const notis = (LIVE.hcd_noticias || []).slice(0, 4).map(n => `<div class="item"><div class="det">${esc(n.titulo)}</div><div class="meta">${fechaRss(n.fecha)}</div></div>`).join('');
    return [
      `<div class="dos"><div class="col"><h2>Martes ${hoy === 'martes' ? '<span class="hoy">· hoy</span>' : ''}</h2><table class="tabla">${tabla('martes')}</table></div>
       <div class="col"><h2>Miércoles ${hoy === 'miércoles' ? '<span class="hoy">· hoy</span>' : ''}</h2><table class="tabla">${tabla('miércoles')}</table>
       <h2 style="margin-top:1.2vw">Lunes</h2><table class="tabla">${tabla('lunes')}</table></div></div>`,
      `<div class="dos"><div class="col"><h2>Últimas sesiones con orden del día</h2><table class="tabla">${hcd}${sen}</table></div>
       <div class="col"><h2>Novedades de la Cámara</h2><div class="lista">${notis}</div></div></div>`
    ];
  }},

  {id:'boctes', corto:'BO Ctes.', titulo:'Boletín Oficial de Corrientes', paginas() { return paginasBO(LIVE.bo_corrientes, 'corrientes.gob.ar/boletinoficial'); }},

  {id:'presidente', corto:'Presidente', titulo:'Presidente Javier Milei', paginas() {
    const p = LIVE.presidente || {};
    const notas = (p.noticias || []).slice(0, 7).map(n => `<div class="item"><div class="org">${esc(n.fuente)} · ${fechaRss(n.fecha)}</div><div class="det">${esc(n.titulo)}</div></div>`).join('');
    const disc = (p.discursos || []).slice(0, 5).map(n => `<div class="item"><div class="org">Casa Rosada · ${fechaRss(n.fecha)}</div><div class="det">${esc(n.titulo)}</div></div>`).join('');
    return [`<div class="dos"><div class="col"><h2>Sus publicaciones en X, según los medios (24 h)</h2><div class="lista">${notas || '<div class="vacio">Sin notas.</div>'}</div></div>
      <div class="col"><h2>Discursos y anuncios oficiales</h2><div class="lista">${disc}</div></div></div>`];
  }},

  {id:'noticias', corto:'Noticias', titulo:'Noticias', paginas() {
    const n = LIVE.noticias || [];
    const tarjeta = i => `<div class="item"><div class="org">${esc(i.fuente)} · ${fechaRss(i.fecha)}</div><div class="det">${esc(i.titulo)}</div></div>`;
    const nac = LIVE.nacionales || [];
    const pags = [];
    if (nac.length) pags.push(`<div class="sub">Titulares nacionales · Google Noticias</div><div class="lista">${nac.slice(0, 8).map(tarjeta).join('')}</div>`);
    if (n.length) pags.push(`<div class="sub">De Corrientes · Google Noticias</div><div class="lista">${n.slice(0, 7).map(tarjeta).join('')}</div>`);
    const m = LIVE.medios;
    if (m) pags.push(`<div class="dos"><div class="col"><h2>La Derecha Diario</h2><div class="lista">${m.derecha_diario.slice(0, 5).map(tarjeta).join('')}</div></div>
      <div class="col"><h2>Carajo · últimos programas</h2><div class="lista">${m.carajo.slice(0, 5).map(tarjeta).join('')}</div></div></div>`);
    return pags;
  }},

  {id:'mapa', corto:'Mapa', titulo:'Cámara de Diputados de Corrientes', paginas() { return [mapa()]; }},
];

function paginasBO(bo, fuente) {
  if (!bo || !bo.items?.length) return [`<div class="vacio">Sin publicaciones disponibles.</div>`];
  const sub = bo.modo === 'noticias'
    ? `<div class="sub">El sitio del Boletín no respondió: se muestran las noticias sobre normas publicadas.</div>`
    : `<div class="sub">Últimas ediciones · ${fuente}</div>`;
  return trozos(bo.items, 7).slice(0, 4).map(g => sub + `<div class="lista">${g.map(i => `<div class="item"><div class="org">${esc(i.organismo)}</div><div class="det">${esc(i.detalle)}</div></div>`).join('')}</div>`);
}

function mapa() {
  const orden = BASE.partidos.map(p => p.nombre);
  const color = Object.fromEntries(BASE.partidos.map(p => [p.nombre, p.color]));
  const dips = BASE.diputados.slice().sort((a, b) => (orden.indexOf(a.partido) - orden.indexOf(b.partido)) || a.apellido.localeCompare(b.apellido));
  // hemiciclo: 4 filas (6, 7, 8 y 9 bancas); se ordenan por ángulo y se asignan de izquierda a derecha
  const filas = [{r: 120, n: 6}, {r: 168, n: 7}, {r: 216, n: 8}, {r: 264, n: 9}];
  const asientos = [];
  for (const f of filas) for (let i = 0; i < f.n; i++) {
    const a = Math.PI - (Math.PI * (i + .5) / f.n);
    asientos.push({x: 300 + f.r * Math.cos(a), y: 290 - f.r * Math.sin(a), a});
  }
  asientos.sort((p, q) => q.a - p.a);
  const rep = a => dips.filter(x => x.apellido === a).length > 1;
  const abrev = d => rep(d.apellido) ? d.nombre[0] + '.' + d.apellido.slice(0, 3) : d.apellido.split(' ')[0].slice(0, 4);
  const circ = asientos.map((s, i) => {
    const d = dips[i]; const lla = d.partido === 'La Libertad Avanza';
    return `<g><circle cx="${s.x.toFixed(1)}" cy="${s.y.toFixed(1)}" r="20" fill="${color[d.partido] || '#666'}" stroke="${lla ? '#fff' : '#0b1220'}" stroke-width="${lla ? 4 : 2}"/>
      <text x="${s.x.toFixed(1)}" y="${(s.y + 5).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" style="paint-order:stroke;stroke:#0009;stroke-width:3px">${esc(abrev(d))}</text></g>`;
  }).join('');
  const grupos = orden.map(p => ({p, ds: dips.filter(d => d.partido === p)})).filter(g => g.ds.length);
  const ley = grupos.map(g => `<div><i style="background:${color[g.p]}"></i><b>${esc(g.p)} (${g.ds.length})</b><span>${g.ds.map(d => esc(d.apellido)).join(', ')}</span></div>`).join('');
  return `<div class="mapa"><svg viewBox="0 0 600 310"><text x="300" y="285" text-anchor="middle" font-size="22" font-weight="800" fill="#e8edf6">30 bancas</text>${circ}</svg><div class="leyenda">${ley}</div></div>`;
}

// ---------------------------------------------------------------- rotación
// En la TV rota sola: cada sección se muestra entera y, si no entra en la
// pantalla, baja despacio hasta el final antes de pasar a la siguiente.
// Tocando una tarjeta queda fija en esa sección (sigue subiendo y bajando).
// "Pausar" la deja quieta. En el teléfono no rota: se usa el scroll normal.
const MOVIL = matchMedia('(max-width: 900px)');
const ESPERA = 3;   // segundos quieto arriba y abajo antes de moverse
let pausado = false, cola = [], pos = -1, temporizador, animacion, auto = !FIJA && !MOVIL.matches, fija = FIJA;
function armarCola() {
  cola = SECCIONES.map(s => {
    let pags; try { pags = s.paginas(); } catch (e) { console.error(s.id, e); pags = [`<div class="vacio">Sin datos.</div>`]; }
    return {s, html: pags.join('')};
  });
}
function tarjetas(actual) {
  document.getElementById('tabs').innerHTML = SECCIONES.map(s =>
    `<button type="button" data-id="${s.id}" class="${s.id === actual ? 'on' : ''}" aria-pressed="${s.id === actual}">${s.corto}</button>`).join('');
  const ctl = document.getElementById('control');
  ctl.hidden = MOVIL.matches;
  ctl.className = 'auto' + (auto ? ' on' : '');
  ctl.setAttribute('aria-pressed', auto);
  ctl.textContent = auto ? '❚❚ Pausar' : '▶ Rotar';
  const t = document.getElementById('tabs'), b = t.querySelector('.on');
  if (b) t.scrollLeft = Math.max(0, b.offsetLeft - t.clientWidth / 2 + b.offsetWidth / 2);
}
document.getElementById('control').addEventListener('click', () => {
  {
    if (auto) { auto = false; pausado = true; fija = cola[pos].s.id; } else { auto = true; pausado = false; fija = null; }
    url(); if (auto) mostrar(1); else { detener(); tarjetas(fija); }
  }
});
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (b) elegir(b.dataset.id);
});
function elegir(id) {
  auto = false; pausado = false; fija = id; url();
  mostrar(1);
  if (MOVIL.matches) document.querySelector('.principal').scrollIntoView({block: 'start'});
}
// rueda del mouse (o dedo) sobre la sección: se pausa y queda donde la dejes
function pausarAqui() {
  if (MOVIL.matches || (pausado && !auto)) return;
  auto = false; pausado = true; fija = cola[pos]?.s.id || fija;
  detener(); tarjetas(fija); url();
}
['wheel', 'touchstart'].forEach(ev => document.getElementById('main').addEventListener(ev, pausarAqui, {passive: true}));
document.getElementById('lateral').addEventListener('click', e => {
  const a = e.target.closest('a.widget'); if (!a) return;
  e.preventDefault(); elegir(a.dataset.id);
});
// la dirección refleja la sección elegida (se puede guardar o compartir)
function url() {
  const q = new URLSearchParams(location.search);
  if (fija) q.set('s', fija); else q.delete('s');
  history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : ''));
}
function detener() {
  clearTimeout(temporizador); cancelAnimationFrame(animacion);
  const barra = document.getElementById('barra');
  barra.style.transition = 'none'; barra.style.width = '0';
}
function sinSubtitulosRepetidos(el) {
  const vistos = new Set();
  el.querySelectorAll('.sub').forEach(x => { if (vistos.has(x.textContent)) x.remove(); else vistos.add(x.textContent); });
}
// baja (o sube) el contenido de la página a velocidad constante
function desplazar(el, hasta, alTerminar) {
  const vel = 55 * innerHeight / 1080;   // píxeles por segundo
  const desde = el.scrollTop, dist = hasta - desde, dur = Math.abs(dist) / vel * 1000;
  const t0 = performance.now();
  const paso = t => {
    const k = Math.min(1, (t - t0) / dur);
    el.scrollTop = desde + dist * k;
    if (k < 1) animacion = requestAnimationFrame(paso); else alTerminar();
  };
  animacion = requestAnimationFrame(paso);
}
function programar(el) {
  const sobra = el.scrollHeight - el.clientHeight;
  const vel = 55 * innerHeight / 1080;
  const total = sobra > 4 ? ESPERA * 2 + sobra / vel : SEG;
  const barra = document.getElementById('barra');
  requestAnimationFrame(() => requestAnimationFrame(() => { barra.style.transition = `width ${total}s linear`; barra.style.width = '100%'; }));
  if (sobra <= 4) { if (auto) temporizador = setTimeout(() => mostrar(1), SEG * 1000); return; }
  temporizador = setTimeout(() => desplazar(el, sobra, () => {
    temporizador = setTimeout(() => {
      if (auto) return mostrar(1);
      el.scrollTo({top: 0, behavior: 'smooth'});          // sección fija: vuelve arriba y repite
      detener(); temporizador = setTimeout(() => programar(el), 1500);
    }, ESPERA * 1000);
  }), ESPERA * 1000);
}
function mostrar(delta = 1) {
  if (!cola.length) return;
  if (fija) pos = cola.findIndex(c => c.s.id === fija);
  else pos = (pos + delta + cola.length) % cola.length;
  const c = cola[pos];
  const main = document.getElementById('main');
  detener();
  tarjetas(c.s.id);
  document.querySelectorAll('.widget').forEach(w => w.classList.toggle('on', w.dataset.id === c.s.id));
  document.getElementById('titulo').textContent = c.s.titulo;
  if (MOVIL.matches) {   // sección completa, sin transición ni temporizador
    main.innerHTML = `<div class="pagina">${c.html}</div>`;
    sinSubtitulosRepetidos(main);
    return;
  }
  const nueva = document.createElement('div');
  nueva.className = 'pagina'; nueva.innerHTML = c.html;
  sinSubtitulosRepetidos(nueva);
  main.appendChild(nueva);
  requestAnimationFrame(() => nueva.classList.add('visible'));
  [...main.children].slice(0, -1).forEach(v => { v.classList.remove('visible'); setTimeout(() => v.remove(), 900); });
  if (c.s.alMostrar) setTimeout(c.s.alMostrar, 50);
  if (!pausado) programar(nueva);
}
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { fija = null; auto = true; pausado = false; url(); mostrar(e.key === 'ArrowRight' ? 1 : -1); }
});
MOVIL.addEventListener('change', () => { auto = !fija && !MOVIL.matches; mostrar(0); });
// el puntero se esconde a los 3 segundos sin moverse (para la TV)
let quieto;
document.addEventListener('mousemove', () => {
  document.body.classList.remove('quieto'); clearTimeout(quieto);
  quieto = setTimeout(() => document.body.classList.add('quieto'), 3000);
});

// ---------------------------------------------------------------- columna de tarjetas
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function lateral() {
  const w = (id, titulo, extra, cuerpo) =>
    `<a class="widget" href="?s=${id}" data-id="${id}"><h2>${titulo}${extra ? `<small>${extra}</small>` : ''}</h2>${cuerpo}</a>`;
  const out = [];

  // 1. proyectos de Leconte
  const est = LIVE.expedientes || {};
  const ps = BASE.proyectos || [];
  const cuenta = re => ps.filter(p => re.test(p.estado)).length;
  const cambios = ps.filter(p => est[p.expte]?.cambio && haceDias(est[p.expte].cambio) <= 7);
  const ult = cambios[0] || ps[0];
  out.push(w('proyectos', 'Proyectos de Leconte', '', `
    <div class="mini">
      <div><b>${ps.length}</b><span>presentados</span></div>
      <div><b>${cuenta(/aprob/i)}</b><span>aprobados</span></div>
      <div><b>${cuenta(/comisi|ingres/i)}</b><span>en comisión</span></div>
      <div><b>${cuenta(/prefer/i)}</b><span>con preferencia</span></div>
    </div>
    ${ult ? `<div class="nota n1">${cambios.length ? 'Movimiento' : 'Último'}: ${esc(ult.tema)} (Expte. ${ult.expte.replace(/(\d{2})(\d{3})/, '$1.$2')})</div>` : ''}`));

  // 2. comisiones: hoy y los próximos días con reuniones, hasta 4 renglones
  const hoyN = new Date(new Date().toLocaleString('en-US', {timeZone: TZ})).getDay();
  const lista = [];
  for (let k = 0; k < 7 && lista.length < 4; k++) {
    const d = DIAS[(hoyN + k) % 7];
    const del = (BASE.comisiones || []).filter(c => c.dia === d).sort((a, b) => a.hora.localeCompare(b.hora));
    del.forEach(c => lista.push({...c, k}));
  }
  const abrev = c => c.k === 0 ? c.hora : c.dia.slice(0, 3) + ' ' + c.hora;
  out.push(w('comisiones', 'Comisiones', lista[0]?.k === 0 ? 'hoy' : 'próximas',
    lista.slice(0, 3).map(c => `<div class="renglon ${c.leconte ? 'lec' : ''}"><time>${abrev(c)}</time><span class="t">${esc(c.nombre.split(',')[0])}${c.leconte ? ' · Leconte' : ''}</span></div>`).join('')));

  // 3. sesiones en Corrientes
  const od = LIVE.hcd_od, sc = (LIVE.senado_corrientes || [])[0];
  const lec = od ? od.asuntos.filter(a => a.leconte).length : 0;
  out.push(w('od', 'Sesiones en Corrientes', '', `
    ${od ? `<div class="fuerte">Diputados: ${esc(od.titulo.replace(/\s*–.*$/, ''))}</div>
    <div class="nota">${od.asuntos.length} asuntos${lec ? ` · ${lec} del Dip. Leconte` : ''}</div>` : ''}
    ${sc ? `<div class="renglon"><time>${fechaCorta(sc.fecha)}</time><span class="t">Senado · orden del día N.º ${sc.numero}</span></div>` : ''}`));

  // 4. Boletín Oficial de Corrientes
  const bcs = LIVE.bo_corrientes?.items || [], bc = bcs[0], directo = LIVE.bo_corrientes?.modo !== 'noticias';
  out.push(w('boctes', 'Boletín Oficial de Corrientes', bc && directo ? esc(bc.organismo.replace('Boletín Oficial ', '')) : '',
    bc ? `<div class="nota">${esc(bc.detalle)}</div>` : '<div class="nota">Sin ediciones disponibles.</div>'));

  // 5. titulares nacionales
  const nac = (LIVE.nacionales || []).slice(0, 2);
  out.push(w('noticias', 'Titulares nacionales', '',
    nac.map(i => `<div class="renglon"><span class="t">${esc(i.titulo)}</span></div>`).join('') || '<div class="nota">Sin titulares.</div>'));

  document.getElementById('lateral').innerHTML = out.join('');
  const actual = cola[pos]?.s.id;
  document.querySelectorAll('.widget').forEach(x => x.classList.toggle('on', x.dataset.id === actual));
}

function pie() {
  const d = LIVE.dolar || [];
  const nombre = {'Oficial':'Oficial','Blue':'Blue','Bolsa':'MEP','Contado con liquidación':'CCL','Mayorista':'Mayorista'};
  const rp = LIVE.riesgo_pais;
  document.getElementById('cot').innerHTML = d.filter(x => x.casa !== 'Mayorista').map(x => `<div><span>Dólar ${nombre[x.casa] || x.casa}</span><b>$ ${fmtN(x.venta)}</b></div>`).join('')
    + (rp ? `<div class="rp"><span>Riesgo país</span><b>${fmtN(rp.valor)} pb</b></div>` : '');
  if (LIVE.actualizado) document.getElementById('act').textContent = 'Datos: ' + new Date(LIVE.actualizado).toLocaleString('es-AR', {timeZone: TZ, day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23'});
}
function reloj() {
  const n = new Date();
  const [hh, mm] = n.toLocaleTimeString('es-AR', {timeZone: TZ, hour:'2-digit', minute:'2-digit', hourCycle:'h23'}).split(':');
  const h = document.getElementById('hora');
  if (h.dataset.v !== hh + mm) { h.dataset.v = hh + mm; h.innerHTML = `${hh}<span class="dp">:</span>${mm}`; }
  const f = n.toLocaleDateString('es-AR', {timeZone: TZ, weekday:'long', day:'numeric', month:'long'});
  document.getElementById('fecha').textContent = f[0].toUpperCase() + f.slice(1);
}

async function cargar() {
  const v = '?v=' + Date.now();
  try {
    const [b, l] = await Promise.all([fetch('data/base.json' + v).then(r => r.json()), fetch('data/live.json' + v).then(r => r.json())]);
    BASE = b; LIVE = l;
  } catch (e) { console.error('No se pudieron leer los datos', e); }
  pie();
  const actual = cola[pos]?.s.id;
  armarCola();
  lateral();
  if (actual) { pos = Math.max(0, cola.findIndex(c => c.s.id === actual)); if (MOVIL.matches) mostrar(0); }
}

reloj(); setInterval(reloj, 5000);
cargar().then(() => mostrar(1));
setInterval(cargar, 10 * 60 * 1000);           // datos nuevos cada 10 minutos
setTimeout(() => location.reload(), 6 * 3600e3); // recarga completa cada 6 horas
</script>
